# 태그(v1.0.0 등)를 올리면 releases/<태그>/ 의 파일로 GitHub Release 를 만든다.
# 설치본은 https://github.com/cyw0904/naranworks-releases/releases/latest/download/update.json 을 12시간마다 읽어
# 새 버전을 알리고, 같은 Release 의 설치 파일을 받게 한다(update.json 의 url 은 상대 주소).
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          dir="releases/${GITHUB_REF_NAME}"
          test -f "$dir/update.json"
          files=$(find "$dir" -maxdepth 1 -type f ! -name NOTES.md | sort)
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # 같은 판을 다시 올림(매뉴얼 고침 등): 파일을 바꿔 끼우고 설명만 새로
            gh release upload "$GITHUB_REF_NAME" $files --clobber --repo "$GITHUB_REPOSITORY"
            gh release edit "$GITHUB_REF_NAME" --notes-file "$dir/NOTES.md" --latest --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" $files \
              --title "나란웍스 ${GITHUB_REF_NAME#v}" --notes-file "$dir/NOTES.md" --latest
          fi
