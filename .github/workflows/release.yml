# main 에 releases/<판>/ 을 올리면(또는 워크플로를 고치면) 가장 높은 판 폴더의 파일로 GitHub Release 를 만든다.
# 같은 판 Release 가 이미 있으면(초안 포함) 지우고 새로 만든다 — 매뉴얼만 고쳐 다시 올려도 된다. 태그는 Release 가 만든다.
# 설치본은 https://github.com/cyw0904/naranworks-releases/releases/latest/download/update.json 을 12시간마다 읽어
# 새 버전을 알리고, 같은 Release 의 설치 파일을 받게 한다(update.json 의 url 은 상대 주소).
name: release
on:
  push:
    branches: [main]
    paths: ["releases/**", ".github/workflows/release.yml"]
permissions:
  contents: write
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: GitHub Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=$(ls releases | sort -V | tail -1)
          dir="releases/${tag}"
          test -f "$dir/update.json"
          files=$(find "$dir" -maxdepth 1 -type f ! -name NOTES.md | sort)
          for id in $(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq ".[] | select(.tag_name==\"${tag}\") | .id"); do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/${id}"
          done
          gh release create "$tag" $files --target "$GITHUB_SHA" \
            --title "나란웍스 ${tag#v}" --notes-file "$dir/NOTES.md" --latest
